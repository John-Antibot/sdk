[project]
name = "john-antibot"
version = "0.8.0"
description = "Python client for the John Antibot DataDome, Cloudflare and reCAPTCHA APIs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Avenue" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]

[project.urls]
Homepage = "https://antibot.johnavenue.com"
Repository = "https://github.com/John-Antibot/sdk/tree/main/python"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/john_antibot"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
